<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Login | ReUnite</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
          
    <link rel="stylesheet"
          href="{{ url_for('static', filename='user_login.css') }}">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="login-icon">
            <i class="fa-solid fa-user"></i>
        </div>

        <h1>User Login</h1>

        <p>
            Check your family reunification status
        </p>


        {% if error %}

        <div class="error-message">

            <i class="fa-solid fa-circle-exclamation"></i>

            {{ error }}

        </div>

        {% endif %}


        <form action="/user-login" method="POST">

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your registered email"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

            </div>


            <button type="submit">

                <i class="fa-solid fa-right-to-bracket"></i>

                Login as User

            </button>

        </form>


        <div class="register-link">

            New user?

            <a href="/register">
                Register Person
            </a>

        </div>


        <a href="/signin">
            ← Back to Sign In
        </a>

    </div>

</div>

</body>

</html>
